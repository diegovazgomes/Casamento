<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="A história do casal.">
    <meta name="theme-color" content="#1a1714">
    <title>Nossa História</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <script src="assets/js/loading-head-bootstrap.js"></script>
    <script type="module" src="assets/js/loading-init.js"></script>
</head>
<body class="extra-page historia-page">

    <main class="extra-main">
        <section class="content-section extra-intro">
            <span class="section-tag reveal" id="historiaTag">Nossa História</span>
            <h1 class="section-title reveal" id="historiaTitle">Como tudo começou</h1>
            <p class="section-body reveal" id="historiaIntro"></p>
        </section>

        <div class="divider reveal" aria-hidden="true">
            <div class="divider-line"></div>
            <div class="divider-diamond"></div>
            <div class="divider-line"></div>
        </div>

        <div class="extra-content">
            <div class="historia-timeline reveal" id="historiaTimeline"></div>
        </div>

        <section class="historia-gallery-section content-section" id="historiaGallery" hidden>
            <div class="divider reveal" aria-hidden="true">
                <div class="divider-line"></div>
                <div class="divider-diamond"></div>
                <div class="divider-line"></div>
            </div>
            <span class="section-tag reveal" id="historiaGalleryTag">Momentos</span>
            <div class="gallery-container reveal" id="historiaGalleryInner"></div>
        </section>

        <div class="gift-back-wrap">
            <a class="gift-back-link" id="backToExtrasButton" href="index.html?section=extras" aria-label="Voltar para opções extras"></a>
        </div>
    </main>

    <footer>
        <div class="footer-names" id="mainFooterNames"></div>
        <p class="footer-note" id="mainFooterNote"></p>
        <a class="devazi-watermark" id="devaziWatermark" href="https://www.devazi.app" target="_blank" rel="noopener noreferrer" hidden>Criado com devazi.app</a>
    </footer>

    <script type="module" src="assets/js/script.js"></script>
    <script type="module" src="assets/js/historia.js"></script>
</body>
</html>
